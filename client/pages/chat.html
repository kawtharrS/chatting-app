<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="../styles/chat.css">
</head>
<body>

<button id="backBtn" class="back-btn"><a href="/client/index.html">Back</a></button>

<div class="layout">

    <div class="habits-panel">
        <h3>Messages</h3>
        <button class="habit-btn-add" id="addContact">+</button>
        <div id="contactsList"></div>
    </div>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <h2>Choose your contact to start...</h2>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a message...">
            <button id="sendBtn" disabled>Send</button>

        </div>
    </div>
</div>

<div id="contactPopup" class="popup hidden">
    <div class="popup-content">
        <p id="popupLabel"></p>
        <input type="number" id="habitValue" placeholder="Enter value" min="0">
        <div class="popup-buttons">
            <button id="deletePopup">DELETE</button>
            <button id="saveContact">Save</button>
        </div>
            <button id="closePopup">Cancel</button>
    </div>
</div>

<div id="addContactPopup" class="popup hidden">
    <div class="popup-content">
        <p>Add New Contact</p>
        <input type="text" id="contactName" placeholder="Name (e.g. John Doe)">
        <input type="text" id="contactEmail" placeholder="Email (e.g. John@gmail.com)">
        <button id="saveNewContact">Save</button>
        <button id="closeNewPopup">Cancel</button>
    </div>
</div>

<script src="../scripts/axios.min.js"></script>
<script src="../scripts/global_scripts.js"></script>
<script src="../scripts/chat/chats_vars.js"></script>
<script src="../scripts/chat/chat.js"></script>
</body>
</html>
